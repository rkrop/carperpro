openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Catalog read endpoints (mirror of Admintotal ERP)
  - name: orders
    description: Outbound order push to Admintotal
  - name: account
    description: Signed-in user account (favorites, addresses, order history)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List categories (lineas)
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /subcategories:
    get:
      operationId: listSubcategories
      tags: [catalog]
      summary: List subcategories (sublineas), optionally filtered by category
      parameters:
        - name: categoryId
          in: query
          required: false
          description: When set, only subcategories under this category (linea).
          schema:
            type: string
      responses:
        "200":
          description: Subcategories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subcategory"
  /brands:
    get:
      operationId: listBrands
      tags: [catalog]
      summary: List brands (marcas)
      responses:
        "200":
          description: Brands
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /sucursales:
    get:
      operationId: listSucursales
      tags: [catalog]
      summary: List sucursales (almacenes)
      responses:
        "200":
          description: Sucursales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sucursal"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List/search products
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: subcategoryId
          in: query
          required: false
          schema:
            type: string
        - name: brand
          in: query
          required: false
          schema:
            type: string
        - name: sucursalId
          in: query
          required: false
          description: When set, stock is reported for this sucursal only.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Products page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
  /products/availability:
    get:
      operationId: getProductsAvailability
      tags: [catalog]
      summary: Batch current stock/availability for a set of product ids
      description: >-
        Lightweight stock lookup used to refresh a saved cart. Reports the
        current stock/stockState for each requested id from the local
        ERP-mirrored count. Ids that no longer exist (deleted/test) are reported
        as out_of_stock.
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated product ids
          schema:
            type: string
      responses:
        "200":
          description: Availability list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityPage"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a single product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: sucursalId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deals:
    get:
      operationId: getDeals
      tags: [catalog]
      summary: Featured deal of the day and current offers
      parameters:
        - name: sucursalId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Deals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deals"
  /sync-status:
    get:
      operationId: getSyncStatus
      tags: [catalog]
      summary: Inbound Admintotal sync status
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
  /postal-codes/{cp}:
    get:
      operationId: getPostalCode
      tags: [catalog]
      summary: Lookup Mexican postal code (estado + colonias) for address autofill
      parameters:
        - name: cp
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Postal code data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostalCode"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Submit an app order (pushed to Admintotal as a pedido)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResult"
        "400":
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get the signed-in user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/favorites:
    get:
      operationId: listFavorites
      tags: [account]
      summary: List the user's saved favorites (product snapshots)
      responses:
        "200":
          description: Favorites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/favorites/{productId}:
    put:
      operationId: addFavorite
      tags: [account]
      summary: Add or update a favorite (stores a product snapshot)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
      responses:
        "204":
          description: Saved
        "400":
          description: Invalid product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeFavorite
      tags: [account]
      summary: Remove a favorite
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
  /me/favorites/sync:
    post:
      operationId: syncFavorites
      tags: [account]
      summary: Merge device-local favorites into the account (no duplicates)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoritesSync"
      responses:
        "200":
          description: Merged favorites list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /me/addresses:
    get:
      operationId: listAddresses
      tags: [account]
      summary: List the user's saved addresses
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
    post:
      operationId: createAddress
      tags: [account]
      summary: Save a new address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "400":
          description: Invalid address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/addresses/{id}:
    put:
      operationId: updateAddress
      tags: [account]
      summary: Update a saved address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "400":
          description: Invalid address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAddress
      tags: [account]
      summary: Delete a saved address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /me/orders:
    get:
      operationId: listMyOrders
      tags: [account]
      summary: List the signed-in user's order history
      responses:
        "200":
          description: Order history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderHistoryItem"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Category:
      type: object
      required: [id, name, icon, count]
      properties:
        id: { type: string }
        name: { type: string }
        icon: { type: string }
        count: { type: integer }
    Subcategory:
      type: object
      required: [id, categoryId, name, count]
      properties:
        id: { type: string }
        categoryId: { type: string }
        name: { type: string }
        count: { type: integer }
    Sucursal:
      type: object
      required: [id, name, address, city, hours]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        hours: { type: string }
    Spec:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
    Product:
      type: object
      required:
        - id
        - sku
        - name
        - brand
        - price
        - stock
        - stockState
        - compatible
        - specs
        - vehicles
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        brand: { type: string }
        price: { type: number }
        originalPrice: { type: ["number", "null"] }
        # On-hand units. null means availability is UNKNOWN (not yet reported by
        # the ERP); a number is the real confirmed count. Use stockState to drive
        # UI rather than comparing stock to 0.
        stock: { type: ["integer", "null"] }
        # Availability state derived from stock: "in_stock" (count > 0),
        # "out_of_stock" (confirmed 0, hidden from listings), or "unknown".
        stockState:
          type: string
          enum: [in_stock, out_of_stock, unknown]
        categoryId: { type: ["string", "null"] }
        subcategoryId: { type: ["string", "null"] }
        image: { type: ["string", "null"] }
        compatible: { type: boolean }
        specs:
          type: array
          items:
            $ref: "#/components/schemas/Spec"
        vehicles:
          type: array
          items:
            type: string
        oem:
          type: ["array", "null"]
          items:
            type: string
        equivalents:
          type: ["array", "null"]
          items:
            type: string
        descripcion: { type: ["string", "null"] }
    ProductAvailability:
      type: object
      required: [id, stock, stockState]
      properties:
        id: { type: string }
        # On-hand units. null means availability is UNKNOWN (not yet reported by
        # the ERP); a number is the real confirmed count.
        stock: { type: ["integer", "null"] }
        stockState:
          type: string
          enum: [in_stock, out_of_stock, unknown]
    AvailabilityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductAvailability"
    ProductPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total: { type: integer }
    Deals:
      type: object
      required: [ofertas]
      properties:
        dealOfDay:
          oneOf:
            - $ref: "#/components/schemas/Product"
            - type: "null"
        ofertas:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    SyncStatus:
      type: object
      required: [status, productsSynced, categoriesSynced, sucursalesSynced, brandsSynced]
      properties:
        status: { type: string }
        lastStartedAt: { type: ["string", "null"], format: date-time }
        lastFinishedAt: { type: ["string", "null"], format: date-time }
        lastSuccessAt: { type: ["string", "null"], format: date-time }
        lastError: { type: ["string", "null"] }
        message: { type: ["string", "null"] }
        productsSynced: { type: integer }
        categoriesSynced: { type: integer }
        sucursalesSynced: { type: integer }
        brandsSynced: { type: integer }
    OrderLineInput:
      type: object
      required: [productId, sku, name, qty, price]
      properties:
        productId: { type: string }
        sku: { type: string }
        name: { type: string }
        qty: { type: integer }
        price: { type: number }
    PostalCode:
      type: object
      required: [cp, estado, municipio, colonias]
      properties:
        cp: { type: string }
        estado: { type: string }
        municipio: { type: string }
        colonias:
          type: array
          items: { type: string }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
    ShippingAddress:
      type: object
      required: [calle, numExterior, colonia, cp]
      properties:
        calle: { type: string }
        numExterior: { type: string }
        numInterior: { type: ["string", "null"] }
        colonia: { type: string }
        cp: { type: string }
        municipio: { type: ["string", "null"] }
        estado: { type: ["string", "null"] }
        referencias: { type: ["string", "null"] }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        mapsUrl: { type: ["string", "null"] }
    OrderInput:
      type: object
      required: [lines, sucursalId, entrega, pago, total]
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineInput"
        sucursalId: { type: string }
        entrega: { type: string }
        pago: { type: string }
        total: { type: number }
        buyerName: { type: ["string", "null"] }
        buyerPhone: { type: ["string", "null"] }
        shippingAddress:
          oneOf:
            - $ref: "#/components/schemas/ShippingAddress"
            - type: "null"
    OrderResult:
      type: object
      required: [id, folio, status]
      properties:
        id: { type: integer }
        folio: { type: string }
        status: { type: string }
        admintotalPedidoId: { type: ["string", "null"] }
    UserProfile:
      type: object
      required: [id]
      properties:
        id: { type: string }
        email: { type: ["string", "null"] }
        name: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
    FavoritesSync:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    Address:
      type: object
      required: [id, address, isDefault]
      properties:
        id: { type: integer }
        label: { type: ["string", "null"] }
        address:
          $ref: "#/components/schemas/ShippingAddress"
        isDefault: { type: boolean }
    AddressInput:
      type: object
      required: [address]
      properties:
        label: { type: ["string", "null"] }
        address:
          $ref: "#/components/schemas/ShippingAddress"
        isDefault: { type: ["boolean", "null"] }
    OrderHistoryItem:
      type: object
      required: [id, folio, date, total, entrega, pago, status, paymentStatus, lines]
      properties:
        id: { type: string }
        folio: { type: string }
        date: { type: string, format: date-time }
        total: { type: number }
        entrega: { type: string }
        pago: { type: string }
        status: { type: string }
        paymentStatus: { type: string }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineInput"
